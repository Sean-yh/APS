[build]
# Keep Railway's native Python builder (matches what you saw in deploy logs).
builder = "RAILPACK"

[deploy]
# Run migrations before the new deploy starts serving traffic.
preDeployCommand = ["alembic -c alembic.ini upgrade head"]

# FastAPI entrypoint for this repo.
startCommand = "uvicorn ai.api:app --host 0.0.0.0 --port $PORT"

# Railway healthcheck (also used by the frontend to verify backend is up).
healthcheckPath = "/health"
healthcheckTimeout = 100

# Sensible default: restart if the process crashes.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

